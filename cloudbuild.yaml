# Cloud Build pipeline: build image -> push to Artifact Registry -> deploy to Cloud Run.
#
# Mirrors the backend pipeline (IZSoftware/Investors_Portal_Backend) and the other
# frontend services in this project (crm-web, portal-web, izhub-web).
#
# Every substitution has a default below, so the trigger needs none and a manual
# `gcloud builds submit --config cloudbuild.yaml .` behaves identically. Values set
# on the trigger override these.
#
# Nothing here is secret: the bundle is public and _API_BASE_URL is compiled into
# it, so it cannot be a runtime env var (see Dockerfile).
#
# No test step: the only spec on this branch is the stock CRA `renders learn react
# link` test, which does not match this app and would fail every deploy. Add the
# step back once there is a real suite.

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - '--build-arg'
      - REACT_APP_API_BASE_URL=${_API_BASE_URL}
      - '-t'
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - '-t'
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - '--all-tags'
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--allow-unauthenticated'
      # nginx serving static files; 256Mi/1cpu is ample.
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--cpu-boost'
      - '--timeout=60'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

substitutions:
  _REGION: europe-west1
  _REPO: alpine
  _SERVICE: investors-portal-web
  _API_BASE_URL: https://investors-portal-backend-885787520862.europe-west1.run.app

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
