# Rendered by nginx:alpine's envsubst entrypoint (${PORT} only — see Dockerfile).

# One Cache-Control policy per URL shape, applied once at server level. nginx's
# add_header does NOT merge into a location that declares its own, so setting the
# cache header per location would silently drop the security headers below.
map $uri $nf_cache_control {
    # CRA fingerprints everything here: the URL changes whenever the bytes do.
    ~^/static/                                                                                 "public, max-age=31536000, immutable";
    # Unhashed assets copied from public/ — long enough to help, short enough to roll.
    ~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|jpe?g|png|gif|webp|avif|svg|ico|mp4|webm|json|txt)$    "public, max-age=604800";
    # index.html carries the hashed bundle names, so caching it would keep serving
    # the previous deploy's script tags after a rollout.
    default                                                                                    "no-store, must-revalidate";
}

server {
    listen      ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $nf_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Liveness target. Deliberately not /healthz: Cloud Run's frontend answers
    # that exact path with its own 404 before the request reaches the container.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # A missing bundle must 404 instead of falling through to index.html — HTML
    # served as .js is the classic "Unexpected token '<'" white screen.
    location /static/ {
        try_files $uri =404;
    }

    # React Router owns every other path; hand unknown URLs to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;
}
