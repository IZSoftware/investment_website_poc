# Rendered by nginx:alpine's envsubst entrypoint (${PORT} only — see Dockerfile).
server {
    listen      ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cheap liveness target for uptime checks; never reaches the SPA fallback.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # index.html carries the hashed bundle names, so caching it would keep
    # serving the previous deploy's script tags after a rollout.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # CRA fingerprints everything under /static/, so it is safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router owns every other path; hand unknown URLs to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Basic hardening for a static origin.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
